};

function rc(i){if(i!==undefined)$('#t'+i).textContent=fm(S.boq[i].q*S.boq[i].r);const t=boqT();$('#bk').innerHTML=kp([['التكلفة المباشرة','SAR '+fm(t.sub)],['الإضافات','SAR '+fm(t.oh+t.pr+t.ct)],['الصافي قبل الضريبة','SAR '+fm(t.net)],['الإجمالي شامل 15%','SAR '+fm(t.tot),'up','منخفض '+fm(t.tot*.85)+' · عالي '+fm(t.tot*1.2)]]);save()}

let ph=[];function prev(i){ph=[];$('#pv').innerHTML='';[...i.files].forEach(f=>{const r=new FileReader();r.onload=e=>{const c=document.createElement('canvas'),im=new Image();im.onload=()=>{c.width=160;c.height=160*im.height/im.width;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.6);ph.push(d);$('#pv').innerHTML+=`<img src="${d}">`};im.src=e.target.result};r.readAsDataURL(f)})}

function addVO(){const a=+$('#va').value||0,n='VO-0'+(S.vos.length+1);S.vos.push({n,d:$('#vd').value||'تغيير',a,st:'بانتظار الموافقة'});S.appr.unshift({id:Date.now(),t:'أمر تغيير '+n+' – Bisat IV',d:'+SAR '+fm(a),by:ROLES[role],st:'p'});save();toast('أُرسل للموافقة');go('project')}

function chart(){const c=$('#cf');if(!c)return;c.width=c.parentElement.clientWidth-30;const x=c.getContext('2d'),d=[[120,90],[150,130],[110,140],[170,120],[160,150],[180+S.inv.filter(i=>i.st=='paid').length*10,135]],m=['مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر'],w=c.width/6;x.font='12px sans-serif';d.forEach(([a,b],i)=>{let h=0;const f=()=>{h+=.05;x.clearRect(i*w,0,w,200);x.fillStyle='#14213d';x.fillRect(i*w+w*.2,180-a*h,w*.28,a*h);x.fillStyle='#fca311';x.fillRect(i*w+w*.52,180-b*h,w*.28,b*h);x.fillStyle='#666';x.fillText(m[i],i*w+w*.3,196);if(h<1)requestAnimationFrame(f)};f()})}

function simp(inp){const f=inp.files[0];if(!f)return;f.text().then(txt=>{try{const d=new DOMParser().parseFromString(txt,'application/xml'),g=(n,k)=>{const e=n.getElementsByTagName(k)[0];return e?e.textContent:''};const ty=['FF','FS','SF','SS'];
